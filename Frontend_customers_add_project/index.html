<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Dashboard Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>CRUD Dashboard Manager</h1>

        <!-- Navigation Menu (Edit Tab is now always visible) -->
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchSection('add', event)">Add Data</button>
            <button class="nav-btn" onclick="switchSection('list', event)" id="list">List Data</button>
            <button class="nav-btn" onclick="switchSection('edit', event)" id="edit-tab-btn">Edit Data</button>
            <button class="nav-btn" onclick="switchSection('delete', event)">Delete Data</button>
        </div>

        <!-- 1. ADD SECTION -->
        <div id="add-section" class="section-card active-section">
            <h2>Add New Entry</h2>
            <form id="add-form" action="http://localhost:6140/add" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="add-name" name="name"required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="add-address" name="address" required placeholder="Enter address">
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="add-company" name="company" required placeholder="Enter company name">
                </div>
                <button type="submit" class="btn btn-primary">Save & Add</button>
            </form>
        </div>






        <!-- 2. LIST SECTION -->
        <div id="list-section" class="section-card">
            <h2>Data Records List</h2>
            <p id="list-status-msg" class="info-text">List not loaded yet. Click the button above to view data.</p>
              
        </div>

        <!-- 3. EDIT SECTION -->
        <div id="edit-section" class="section-card">
            <form id="editForm" >
                    <label for="edit-id-select">Select or Enter Record ID to Edit</label>
                    <input type="number" id="edit-id" name="id" placeholder="Enter ID or click Edit from List" required>
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" name="updateName" required placeholder="Enter new name">
                
                <button type="submit" class="btn btn-warning" id="update-btn">Update Record</button>
                <button type="button" class="btn btn-secondary" onclick="switchSection('list', event)">Cancel</button>
            </form>
        </div>

        <!-- 4. DELETE SECTION -->
        <div id="delete-section" class="section-card">
            <h2>Delete Entry by ID</h2>

            <form id="deleteform">
                    <label for="delete-id">Enter Record ID</label>
                    <input type="number" id="delete-id" name="id" required placeholder="Enter ID to delete">
                    <button type="submit" class="btn btn-danger">Delete Record</button>
            </form>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
